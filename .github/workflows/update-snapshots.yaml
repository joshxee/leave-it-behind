name: Update snapshots

# Regenerates the Linux visual baselines. Download the `snapshots` artifact,
# review the images, and commit them under e2e/specs/__screenshots__/.
# Only a human (or the primary model) approves baseline changes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: scripts/ci/install-web-tools.sh
      - run: E2E=1 scripts/build-web.sh
      - name: Update baselines
        working-directory: e2e
        run: |
          npm ci && npx playwright install --with-deps chromium
          npx playwright test --grep @visual --update-snapshots
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapshots
          path: e2e/specs/__screenshots__/
          retention-days: 7
