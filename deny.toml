# cargo-deny configuration. Changing this file is a reviewed change.
[graph]
all-features = false

[advisories]
# RustSec advisories. Unmaintained crates deep in Bevy's tree are warnings
# only for workspace (direct) dependencies.
unmaintained = "workspace"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.9
# MIT-0 (MIT without attribution) is used by Bevy's shader layout crates.
exceptions = [
    { allow = ["MIT-0"], crate = "encase" },
    { allow = ["MIT-0"], crate = "encase_derive" },
    { allow = ["MIT-0"], crate = "encase_derive_impl" },
]

[bans]
# Bevy pulls several versions of some crates; that is expected.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
